<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>MangaDB — October releases prototype</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- Three variants of the release browser, switchable via ?variant=, on this throwaway route. -->
    <header class="site-header">
      <a class="brand" href="./?variant=A" aria-label="MangaDB home">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span>MangaDB</span>
      </a>
      <nav aria-label="Primary navigation">
        <a class="active" href="#">Releases</a>
        <a href="#">Series</a>
        <a href="#">My shelf</a>
      </nav>
      <label class="global-search">
        <span class="sr-only">Search manga</span>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.3-4.3m2.3-5.2a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
        <input type="search" placeholder="Search manga" />
      </label>
      <button class="avatar" aria-label="Open account menu">AD</button>
    </header>

    <main id="app"></main>

    <div class="prototype-switcher" role="group" aria-label="Prototype variant switcher">
      <button id="previous-variant" aria-label="Previous variant">←</button>
      <div>
        <span class="prototype-kicker">Prototype view</span>
        <strong id="variant-label"></strong>
      </div>
      <button id="next-variant" aria-label="Next variant">→</button>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
