# Typecheck, test, and build. Runs on every pull request, where the `check`
# job is the status check the "Protect main" ruleset requires
# (.github/rulesets/main.json), and before every deploy via deploy.yml.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run. Under
# workflow_call, github.workflow is the caller's name and run_id is the
# caller's run, so the group is unique to that deploy and cancels nothing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
