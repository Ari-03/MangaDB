# Deploys Convex and the Worker to one environment. A push to main targets
# production, which waits for approval in the `production` GitHub environment.
# "Run workflow" (or `gh workflow run deploy.yml`) deploys any branch, to
# staging by default. Both environments hold the same secret names, so one
# job serves both. README "Deployment" has the setup.
name: Deploy
run-name: Deploy ${{ inputs.environment || 'production' }} from ${{ github.ref_name }}

on:
  push:
    branches: [main]
    # A docs-only merge would otherwise park a production run that waits for
    # approval and holds the production queue.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.scratch/**'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: ${{ steps.target.outputs.url }}
    # Deploys to one environment take turns. A running deploy is never
    # cancelled, since that could leave Convex and the Worker out of step.
    concurrency:
      group: deploy-${{ inputs.environment || 'production' }}
      cancel-in-progress: false
    env:
      TARGET: ${{ inputs.environment || 'production' }}
    steps:
      # The one place that maps a target to its URL, Worker and build script.
      - name: Resolve target
        id: target
        run: |
          case "$TARGET" in
            production)
              # The environment's branch policy enforces this too.
              if [ "$GITHUB_REF" != refs/heads/main ]; then
                echo "::error::Production deploys only from main, not $GITHUB_REF."
                exit 1
              fi
              url=https://mangadb.org
              worker=mangadb
              build=build
              ;;
            staging)
              url=https://mangadb-staging.mangadb.workers.dev
              worker=mangadb-staging
              build=build:staging
              ;;
            *)
              echo "::error::Unknown target environment: $TARGET"
              exit 1
              ;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "worker=$worker" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      # Checks presence only; values are never printed.
      - name: Check secrets and variables
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          missing=""
          for name in CONVEX_DEPLOY_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VITE_CLERK_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::The $TARGET environment is missing:$missing. See README \"Deployment\" for the one-time setup."
            exit 1
          fi

      # Reads the target Worker's deployments before Convex is pushed, so a bad
      # token, a wrong account ID, or a token scoped to the other Worker fails
      # with nothing deployed. It asks for one Worker, not the account's list,
      # because each token is scoped to a single Worker (README "Deployment").
      # It cannot prove every permission `wrangler deploy` needs.
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER: ${{ steps.target.outputs.worker }}
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER/deployments") || status=000
          case "$status" in
            2??) echo "Cloudflare credentials can read Worker $WORKER (HTTP $status)." ;;
            401|403)
              echo "::error::Cloudflare answered HTTP $status. CLOUDFLARE_API_TOKEN is invalid or has no access to Worker $WORKER."
              exit 1 ;;
            404)
              echo "::error::Cloudflare answered HTTP 404. CLOUDFLARE_ACCOUNT_ID is wrong or Worker $WORKER does not exist there."
              exit 1 ;;
            *)
              echo "::error::Cloudflare answered HTTP $status. Could not confirm the Cloudflare credentials."
              exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # convex deploy runs the build and the target check first and pushes
      # functions and schema only if both pass. No --env-file: it would make
      # the CLI ignore CONVEX_DEPLOY_KEY.
      - name: Deploy Convex and build the Worker
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          BUILD_SCRIPT: ${{ steps.target.outputs.build }}
          # Inlined into the client bundle, so public variables, not secrets.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_PUBLIC_POSTHOG_KEY: ${{ vars.VITE_PUBLIC_POSTHOG_KEY }}
        run: >-
          npx convex deploy --cmd-url-env-var-name VITE_CONVEX_URL
          --cmd "npm run $BUILD_SCRIPT && node scripts/check-deploy-target.mjs $TARGET"

      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # The home page is server-rendered on the Worker with data from Convex.
      - name: Smoke test
        env:
          SITE_URL: ${{ steps.target.outputs.url }}
        run: |
          for attempt in 1 2 3 4 5; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 "$SITE_URL") || status=000
            echo "Attempt $attempt: $SITE_URL answered HTTP $status"
            case "$status" in 2??) exit 0 ;; esac
            sleep 10
          done
          echo "::error::$SITE_URL did not answer with a 2xx after 5 attempts."
          exit 1
